name: Build macOS preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install 'PySide6==6.11.1' 'PyInstaller==6.22.0' 'Pillow==12.1.1'
      - name: Validate desktop behavior
        run: |
          python tests/smoke_desktop.py
          python tests/test_timer_flow.py
          python tests/test_music_controls.py
          python tests/test_reminder.py
      - name: Build native app
        run: python scripts/build_macos.py
      - name: Verify bundle launch and resources
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, time, plistlib
          app = pathlib.Path('dist/stand up.app')
          resources = app / 'Contents/Resources'
          for name in ('assets/quiet-steps-loop.wav', 'assets/gentle-chime.wav', 'assets/app-icon.png', 'assets/fluent/LICENSE', 'assets/fluent/arrow-minimize-20-regular.svg'):
              assert (resources / name).exists(), name
          process = subprocess.Popen([str(app / 'Contents/MacOS/stand up')], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          try:
              time.sleep(8)
              assert process.poll() is None, process.communicate()
          finally:
              if process.poll() is None:
                  process.terminate()
                  process.wait(timeout=10)
          with (app / 'Contents/Info.plist').open('rb') as file:
              print(plistlib.load(file))
          print('PASS: packaged app stays running and resources exist')
          PY
          python -m pip freeze > artifacts/build-environment.txt
      - name: Upload Mac package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stand-up-macos-${{ matrix.arch }}
          path: |
            dist/stand-up-macos-${{ matrix.arch }}.zip
            dist/stand-up-macos-${{ matrix.arch }}.sha256
            artifacts/*.png
            artifacts/build-environment.txt
          if-no-files-found: error

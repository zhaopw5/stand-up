name: Build Ubuntu package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install Linux audio runtime
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libpulse0 libxcb-cursor0 libxkbcommon-x11-0
      - name: Install build dependencies
        run: python -m pip install 'PySide6==6.11.1' 'PyInstaller==6.22.0'
      - name: Validate desktop behavior
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/smoke_desktop.py
          python tests/test_timer_flow.py
          python tests/test_music_controls.py
          python tests/test_reminder.py
      - name: Build Linux executable
        run: |
          python -m PyInstaller --noconfirm --windowed --onedir --name 'stand up' \
            --add-data 'assets/app-icon.png:assets' \
            --add-data 'assets/gentle-chime.wav:assets' \
            --add-data 'assets/quiet-steps-loop.wav:assets' \
            --add-data 'assets/fluent:assets/fluent' \
            --add-data 'THIRD_PARTY_NOTICES.md:.' work_buddy.py
          mkdir -p dist/stand-up-linux-x86_64/licenses
          cp -r 'dist/stand up' 'dist/stand-up-linux-x86_64/stand up'
          cp THIRD_PARTY_NOTICES.md dist/stand-up-linux-x86_64/licenses/
          cp -r assets/fluent dist/stand-up-linux-x86_64/licenses/fluent
          cp docs/MACOS.md dist/stand-up-linux-x86_64/README.md
          tar -czf dist/stand-up-linux-x86_64.tar.gz -C dist stand-up-linux-x86_64
          sha256sum dist/stand-up-linux-x86_64.tar.gz > dist/stand-up-linux-x86_64.sha256
      - name: Verify package
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          test -x 'dist/stand-up-linux-x86_64/stand up/stand up'
          test -f 'dist/stand-up-linux-x86_64/stand up/assets/quiet-steps-loop.wav'
          timeout 10 'dist/stand-up-linux-x86_64/stand up/stand up' || test $? -eq 124
          tar -tzf dist/stand-up-linux-x86_64.tar.gz | grep -q 'quiet-steps-loop.wav'
          sha256sum -c dist/stand-up-linux-x86_64.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stand-up-linux-x86_64
          path: |
            dist/stand-up-linux-x86_64.tar.gz
            dist/stand-up-linux-x86_64.sha256

name: Build Android preview
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      ANDROID_RELEASE_KEYSTORE:
        required: true
      ANDROID_RELEASE_PASSWORD:
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify Gradle wrapper
        run: |
          echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  android/gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          chmod +x android/gradlew
      - name: Test, lint and build
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Enable hardware acceleration for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android device tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          working-directory: android
          disable-animations: true
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest
            adb shell am start -W -n com.zhaopw.standup/.MainActivity
            mkdir -p app/build/reports/device
            adb exec-out screencap -p > app/build/reports/device/android-16.png
      - name: Sign and verify release APK
        env:
          RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE" && test -n "$RELEASE_PASSWORD"
          umask 077
          KEY_FILE="$RUNNER_TEMP/stand-up-release.p12"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$KEY_FILE"
          mkdir -p dist/android
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$KEY_FILE" --ks-key-alias stand-up --ks-pass env:RELEASE_PASSWORD --out dist/android/stand-up-android.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/android/stand-up-android.apk
          sha256sum dist/android/stand-up-android.apk > dist/android/stand-up-android.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stand-up-android
          path: dist/android/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
